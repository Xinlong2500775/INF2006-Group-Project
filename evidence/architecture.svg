<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1140" viewBox="0 0 1700 1140" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <style>
      .t  { font-size: 15px; fill: #111827; }
      .ts { font-size: 13px; fill: #374151; }
      .tx { font-size: 12px; fill: #4b5563; }
      .h  { font-size: 17px; font-weight: bold; fill: #111827; }
      .hb { font-size: 15px; font-weight: bold; fill: #111827; }
      .tb { font-size: 13px; font-weight: bold; fill: #b91c1c; }
      .flow { font-size: 13px; font-weight: bold; fill: #1f2937; }
      .mono { font-family: DejaVu Sans Mono, monospace; font-size: 12px; fill: #1f2937; }
    </style>
  </defs>

  <rect x="0" y="0" width="1700" height="1140" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="34" class="h" style="font-size:22px">Campus Lost &amp; Found · AWS architecture (us-east-1)</text>
  <text x="30" y="56" class="ts">Labels match src/infra/DEPLOYMENT.md, evidence/threat-control-map.md and the evidence files.</text>

  <!-- ===== Left column: outside AWS ===== -->
  <rect x="30" y="210" width="200" height="170" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="130" y="240" text-anchor="middle" class="hb">Users (browser)</text>
  <text x="130" y="266" text-anchor="middle" class="ts">Students: report,</text>
  <text x="130" y="284" text-anchor="middle" class="ts">browse, match, claim</text>
  <text x="130" y="312" text-anchor="middle" class="ts">Security staff (admin):</text>
  <text x="130" y="330" text-anchor="middle" class="ts">review &amp; approve claims</text>
  <text x="130" y="362" text-anchor="middle" class="tx">Untrusted network</text>

  <rect x="30" y="600" width="200" height="200" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="130" y="628" text-anchor="middle" class="hb">Offline evaluation</text>
  <text x="130" y="648" text-anchor="middle" class="tx">(laptop, no AWS needed)</text>
  <text x="44" y="676" class="mono">data/*.csv</text>
  <text x="44" y="696" class="tx">105 lost / 105 found, synthetic</text>
  <text x="44" y="724" class="mono">analytics/match.py</text>
  <text x="44" y="744" class="tx">Top-1/3/5 accuracy</text>
  <text x="44" y="772" class="mono">evidence/test-data-ai.md</text>

  <rect x="30" y="900" width="200" height="110" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="130" y="930" text-anchor="middle" class="hb">GitHub repository</text>
  <text x="130" y="954" text-anchor="middle" class="tx">INF2006-Group-Project</text>
  <text x="130" y="974" text-anchor="middle" class="tx">public code, no secrets</text>
  <text x="130" y="994" text-anchor="middle" class="tx">(tests/check_secrets.py)</text>

  <!-- ===== AWS Cloud ===== -->
  <rect x="265" y="80" width="1410" height="1040" rx="16" fill="#fffaf3" stroke="#d97706" stroke-width="2"/>
  <text x="285" y="108" class="h" fill="#92400e">AWS Cloud · Learner Lab · us-east-1</text>

  <!-- VPC -->
  <rect x="290" y="125" width="1030" height="975" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="310" y="150" class="hb" fill="#166534">VPC (2 Availability Zones: us-east-1a, us-east-1b)</text>

  <!-- Public subnets -->
  <rect x="315" y="165" width="980" height="165" rx="10" fill="#ecfdf5" stroke="#86efac"/>
  <text x="330" y="186" class="ts" style="font-weight:bold">Public subnets (AZ a + AZ b)</text>
  <rect x="555" y="200" width="500" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="805" y="228" text-anchor="middle" class="hb">Application Load Balancer · lostfound-alb</text>
  <text x="805" y="252" text-anchor="middle" class="ts">security group alb-sg: HTTP 80 from 0.0.0.0/0</text>
  <text x="805" y="274" text-anchor="middle" class="ts">listener :80 → target group lostfound-tg</text>
  <text x="805" y="296" text-anchor="middle" class="ts">health check /health.php · sticky sessions on</text>

  <!-- TB2 -->
  <line x1="300" y1="382" x2="1310" y2="382" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="315" y="374" class="tb">TB2 · web-sg accepts HTTP 80 only from alb-sg (no direct internet access to servers)</text>

  <!-- Web tier ASG -->
  <rect x="315" y="395" width="980" height="310" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="330" y="418" class="hb">Auto Scaling group lostfound-asg · min 2 / max 4 · target CPU 50% · ELB health checks</text>
  <text x="330" y="438" class="ts">launch template lostfound-lt: Amazon Linux 2023, t3.micro, user data src/infra/user-data.sh, IAM LabInstanceProfile</text>

  <g>
    <rect x="345" y="455" width="440" height="230" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
    <text x="565" y="481" text-anchor="middle" class="hb">EC2 web server · AZ a · web-sg</text>
    <text x="362" y="510" class="ts">Apache httpd + PHP 8 (DocumentRoot = src/public)</text>
    <text x="362" y="532" class="mono">src/public/*.php  register · login · report</text>
    <text x="362" y="550" class="mono">  browse · matches · claim · admin · health</text>
    <text x="362" y="576" class="ts">Matching (AI feature):</text>
    <text x="362" y="596" class="mono">src/inc/matching.php → analytics/</text>
    <text x="362" y="614" class="mono">match_items.py (TF-IDF + cosine)</text>
    <text x="362" y="640" class="ts">Config: src/.env (from SSM at boot, mode 640)</text>
    <text x="362" y="662" class="ts">Logs → CloudWatch agent → /lostfound/httpd</text>
  </g>
  <g>
    <rect x="825" y="455" width="440" height="230" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
    <text x="1045" y="481" text-anchor="middle" class="hb">EC2 web server · AZ b · web-sg</text>
    <text x="842" y="510" class="ts">Identical copy, built by the same</text>
    <text x="842" y="530" class="ts">launch template and user-data script</text>
    <text x="842" y="560" class="ts">Unhealthy instance (health.php ≠ 200)</text>
    <text x="842" y="580" class="ts">→ ALB stops routing to it</text>
    <text x="842" y="600" class="ts">→ ASG terminates and replaces it</text>
    <text x="842" y="630" class="ts">CPU &gt; 50% average → ASG adds</text>
    <text x="842" y="650" class="ts">instances (up to 4)</text>
  </g>

  <!-- TB3 -->
  <line x1="300" y1="782" x2="1310" y2="782" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="315" y="774" class="tb">TB3 · db-sg accepts MySQL 3306 only from web-sg (database never reachable from the internet)</text>

  <!-- Private subnets -->
  <rect x="315" y="795" width="980" height="285" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="330" y="816" class="ts" style="font-weight:bold">Private subnets (AZ a + AZ b) · no route from the internet</text>
  <rect x="535" y="835" width="540" height="215" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="805" y="863" text-anchor="middle" class="hb">Amazon RDS for MySQL · lostfound-db · db-sg</text>
  <text x="805" y="888" text-anchor="middle" class="ts">db.t3.micro · Single-AZ · Publicly accessible: No</text>
  <text x="805" y="910" text-anchor="middle" class="ts">automated backups, 1-day retention (point-in-time restore)</text>
  <text x="805" y="940" text-anchor="middle" class="mono">database inf2006: users · items · claims</text>
  <text x="805" y="960" text-anchor="middle" class="tx">schema: data/schema.sql · fields: data/DATA_DICTIONARY.md</text>
  <text x="805" y="988" text-anchor="middle" class="ts">app login lostfound_app: SELECT, INSERT, UPDATE only</text>
  <text x="805" y="1008" text-anchor="middle" class="tx">(data/db_app_user.sql · master user only for schema loads)</text>
  <text x="805" y="1032" text-anchor="middle" class="tx">passwords stored as bcrypt hashes</text>

  <!-- ===== Right column: regional services ===== -->
  <rect x="1345" y="165" width="310" height="150" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="1500" y="192" text-anchor="middle" class="hb">SSM Parameter Store</text>
  <text x="1360" y="220" class="mono">/lostfound/db_host</text>
  <text x="1360" y="240" class="tx">String</text>
  <text x="1360" y="266" class="mono">/lostfound/db_password</text>
  <text x="1360" y="286" class="tx">SecureString (KMS-encrypted)</text>
  <text x="1360" y="304" class="tx">never in Git, ZIP or launch template</text>

  <rect x="1345" y="400" width="310" height="300" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="1500" y="427" text-anchor="middle" class="hb">Amazon CloudWatch</text>
  <text x="1360" y="454" class="ts" style="font-weight:bold">Metrics (automatic):</text>
  <text x="1360" y="475" class="tx">ALB: UnHealthyHostCount, 5XX,</text>
  <text x="1360" y="493" class="tx">TargetResponseTime</text>
  <text x="1360" y="513" class="tx">EC2: CPUUtilization (scaling)</text>
  <text x="1360" y="533" class="tx">RDS: CPU, FreeStorageSpace</text>
  <text x="1360" y="565" class="ts" style="font-weight:bold">Alarm:</text>
  <text x="1360" y="586" class="mono">lostfound-unhealthy-hosts</text>
  <text x="1360" y="606" class="tx">UnHealthyHostCount ≥ 1 for 1 min</text>
  <text x="1360" y="626" class="ts" style="font-weight:bold">Logs: /lostfound/httpd (7 days)</text>
  <text x="1360" y="656" class="tx">evidence/monitoring.md</text>
  <text x="1360" y="676" class="tx">evidence/test-resilience.md</text>

  <!-- Legend -->
  <rect x="1345" y="760" width="310" height="270" rx="10" fill="#ffffff" stroke="#9ca3af"/>
  <text x="1360" y="786" class="hb">Legend</text>
  <line x1="1362" y1="812" x2="1420" y2="812" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="1430" y="817" class="tx">runtime request / data flow</text>
  <line x1="1362" y1="842" x2="1420" y2="842" stroke="#15803d" stroke-width="2" marker-end="url(#arrgreen)"/>
  <text x="1430" y="847" class="tx">metrics / monitoring</text>
  <line x1="1362" y1="872" x2="1420" y2="872" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrg)"/>
  <text x="1430" y="877" class="tx">deploy-time / offline</text>
  <line x1="1362" y1="902" x2="1420" y2="902" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="1430" y="907" class="tx">trust boundary (TB1 to TB3)</text>
  <text x="1360" y="940" class="tx">Security controls per boundary:</text>
  <text x="1360" y="958" class="tx">evidence/threat-control-map.md</text>
  <text x="1360" y="986" class="tx">Data stores: RDS (live data),</text>
  <text x="1360" y="1004" class="tx">data/*.csv (offline evaluation)</text>

  <!-- ===== Flows ===== -->
  <line x1="248" y1="90" x2="248" y2="1110" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="240" y="160" class="tb" text-anchor="end">TB1 · internet</text>
  <text x="240" y="176" class="tb" text-anchor="end">→ AWS</text>

  <path d="M230,265 C380,265 420,250 553,250" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="325" y="196" width="190" height="40" rx="6" fill="#ecfdf5"/>
  <text x="335" y="212" class="flow">① HTTP :80 to ALB</text>
  <text x="335" y="229" class="tx">only public entry point</text>

  <path d="M700,305 L600,453" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M910,305 L1010,453" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="726" y="312" width="160" height="40" rx="6" fill="#ecfdf5"/>
  <text x="806" y="328" text-anchor="middle" class="flow">② HTTP :80</text>
  <text x="806" y="345" text-anchor="middle" class="tx">+ /health.php checks</text>

  <path d="M600,685 L700,833" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M1010,685 L910,833" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="706" y="712" width="200" height="40" rx="6" fill="#ffffff"/>
  <text x="806" y="728" text-anchor="middle" class="flow">③ MySQL :3306</text>
  <text x="806" y="745" text-anchor="middle" class="tx">prepared statements</text>

  <path d="M1265,490 C1310,490 1300,250 1343,250" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrg)"/>
  <rect x="1400" y="330" width="200" height="40" rx="6" fill="#fffaf3"/>
  <text x="1500" y="346" text-anchor="middle" class="flow">④ read DB config</text>
  <text x="1500" y="363" text-anchor="middle" class="tx">at boot, via IAM role</text>

  <path d="M1265,590 L1343,590" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#arrgreen)"/>
  <path d="M1055,265 C1250,265 1250,450 1343,455" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#arrgreen)"/>
  <path d="M1075,940 C1300,940 1300,670 1343,670" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#arrgreen)"/>
  <text x="1305" y="580" class="flow" style="fill:#15803d">⑤</text>

  <path d="M230,1005 C290,1005 290,600 343,600" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrg)"/>
  <text x="34" y="1090" class="flow">⑥ git clone at boot</text>
  <text x="34" y="1106" class="tx">(src/infra/user-data.sh)</text>

  <path d="M230,730 C300,730 300,640 343,640" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="3 4"/>
  <text x="34" y="865" class="tx">⑦ evaluates the same</text>
  <text x="34" y="881" class="tx">match_items.py the app runs</text>
</svg>
