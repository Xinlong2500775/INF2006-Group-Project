architecture:
  diagram: "evidence/architecture.png"
  service_model: >-
    IaaS for compute and networking (EC2 in an Auto Scaling group behind an Application Load
    Balancer, VPC, security groups); PaaS for the database (Amazon RDS for MySQL) and for
    monitoring (CloudWatch).
  deployment_model: "Public cloud (AWS us-east-1, AWS Academy Learner Lab), single region, 2 Availability Zones"
  components:
    - name: "lostfound-alb"
      type: "Application Load Balancer"
      purpose: "Single public entry point; health checks /health.php; sticky sessions"
      security_group: "alb-sg"
    - name: "lostfound-tg"
      type: "ALB target group"
      purpose: "Web servers registered by the Auto Scaling group"
    - name: "lostfound-asg"
      type: "EC2 Auto Scaling group"
      purpose: "EC2 instances named lostfound-web (t3.micro) in private app subnets across 2 AZs running Apache + PHP and the Python matcher; min 1, desired 2, max 3, CPU 50% target tracking"
      launch_template: "lostfound-lt"
      config: "src/infra/user-data.sh"
      security_group: "web-sg"
      source: "src/public, src/inc, analytics/match_items.py"
    - name: "lostfound-db"
      type: "Amazon RDS for MySQL"
      purpose: "Persistent store for users, items and claims; private subnets; not publicly accessible"
      schema: "data/schema.sql"
      app_account: "data/db_app_user.sql"
      security_group: "db-sg"
    - name: "lostfound-unhealthy-hosts"
      type: "CloudWatch alarm"
      purpose: "Alerts when any target fails its health check"
    - name: "/lostfound/httpd"
      type: "CloudWatch Logs log group"
      purpose: "Apache and PHP logs from every instance, 7-day retention"
    - name: "AWS Budgets cost alert"
      type: "AWS Budgets"
      purpose: "Alerts the team by email at 80% of a monthly cost limit"
  deployment_guide: "src/infra/DEPLOYMENT.md"
  deployment_record: "evidence/deployment.md"

evidence:
  functional_test: "evidence/test-functional.md"
  security_test: "evidence/test-security.md"
  data_ai_test: "evidence/test-data-ai.md"
  scale_resilience_test: "evidence/test-resilience.md"
  monitoring: "evidence/monitoring.md"
  automated_tests: "tests/run_tests.py"
  data_ai_output: "evidence/test-data-ai-output.csv"

data_ai:
  dataset: "data/README.md"
  data_dictionary: "data/DATA_DICTIONARY.md"
  method: >-
    TF-IDF vectorisation (English stop words removed) of each report's category + description +
    location, then cosine similarity between a lost report and every open found report. The top 5
    found items scoring at least 20% are shown to the owner with a match percentage. Implemented in
    analytics/match_items.py and called live by src/inc/matching.php.
  evaluation: >-
    Offline evaluation of the production function on 105 synthetic lost and 105 found reports with
    known ground truth (85 true pairs, 20 lost reports with no match). Top-1 accuracy 34.1%, Top-3
    65.9%, Top-5 89.4% (target: Top-5 >= 50%, met). All 20 no-match reports still receive
    suggestions, mitigated by human verification of every claim. Description-only baseline:
    Top-5 35.3%.
  reproducible_command: "pip install -r analytics/requirements.txt && python3 analytics/match.py"

security:
  threat_control_map: "evidence/threat-control-map.md"
  secrets_handling: >-
    No credentials in the repository or ZIP. The app reads DB_HOST, DB_USER, DB_PASSWORD and DB_NAME
    from environment variables or src/.env (gitignored; template src/.env.example). On AWS,
    the endpoint and password are entered only in the launch template's copy of
    src/infra/user-data.sh, which writes them at boot to the local config file src/.env (mode 640,
    root and Apache only, outside the web root); the Git copy keeps placeholders. No Secrets
    Manager (cost and scope); moving to Secrets Manager with rotation is the documented production
    improvement. The app connects as the least-privilege lostfound_app account (SELECT, INSERT, UPDATE
    only). Checked by tests/check_secrets.py.
  named_threat: "Insecure direct object reference (OWASP A01 Broken Access Control), tested in evidence/test-security.md"

run:
  prerequisites:
    - "PHP 8.x with the mysqli extension (e.g. XAMPP on Windows, or Apache + php-fpm on Linux)"
    - "MySQL 8 or MariaDB 10.4+"
    - "Python 3.9+ with pip"
    - "For the cloud deployment only: an AWS account (AWS Academy Learner Lab), approx. US$0.11 per hour including the NAT gateway while running; see src/infra/DEPLOYMENT.md"
  commands:
    - "pip install -r analytics/requirements.txt -r tests/requirements.txt"
    - "python3 analytics/match.py   # data/AI evaluation, offline, no database needed"
    - "mysql -u root -e \"CREATE DATABASE inf2006\" && mysql -u root inf2006 < data/schema.sql"
    - "cp src/.env.example src/.env   # then set DB_HOST/DB_USER/DB_PASSWORD"
    - "php -S 127.0.0.1:8080 -t src/public   # or serve src/public with Apache/XAMPP"
    - "python3 tests/run_tests.py http://127.0.0.1:8080   # functional + security tests"
    - "python3 tests/check_secrets.py"

