project:
  group_id: "G010"
  title: "Campus Lost & Found"
  problem_statement: >-
    SIT has no single place to report or search for lost and found items: finders hand items to
    Security, owners must visit or email Security to ask, and notices are scattered across chat
    groups and noticeboards. Campus Lost & Found lets students and staff report lost and found
    items online, browse what has been handed in, see automatically ranked description matches
    with a match percentage, and submit an ownership claim that Security verifies against a
    private detail before the item is released.
